# Gibber Cloud Sandbox Manager — gibber.nativelaunch.xyz
server {
    server_name gibber.nativelaunch.xyz;

    # Let certbot answer ACME challenges without touching this config again
    location /.well-known/acme-challenge/ { root /var/www/html; }

    client_max_body_size 32m;

    # --- Live sandbox previews: /preview/port/41007/ -> 127.0.0.1:41007 ---
    # NOTE: nginx needs a regex containing { } to be quoted, otherwise it
    # parses the brace as a block delimiter.
    # The regex pins the range to the sandbox port pool so this cannot be used
    # to reach arbitrary services on the host (e.g. 22 or 3100).
    location ~ "^/preview/port/(41[0-9]{3})/(.*)$" {
        proxy_pass http://127.0.0.1:$1/$2$is_args$args;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;       # vite HMR websocket
        proxy_set_header Connection "upgrade";
        # Vite 5.4+ rejects unknown Host headers (allowedHosts). Presenting the
        # loopback origin keeps sandbox projects free of proxy-specific config.
        proxy_set_header Host 127.0.0.1:$1;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # --- API + socket.io terminal ---
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A streamed npm install / dev server must never be cut off mid-flight
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/gibber.nativelaunch.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/gibber.nativelaunch.xyz/privkey.pem; # managed by Certbot
    # The certbot cipher list made Cloudflare fail the origin TLS handshake
    # (nginx: "bad cipher" -> CF error 525). Use the broader list that the
    # other vhost on this host already serves to Cloudflare successfully.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;

}

server {
    if ($host = gibber.nativelaunch.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name gibber.nativelaunch.xyz;
    return 404; # managed by Certbot


}